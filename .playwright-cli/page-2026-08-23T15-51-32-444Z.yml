      - paragraph [ref=e25]: In elk bedrijf zit werk waar eigenlijk niemand voor is aangenomen. Opzoeken, overtypen, mail doorspitten, gegevens bij elkaar rapen. De vraag is niet of je dat kunt automatiseren, want dat kan tegenwoordig bijna altijd. De vraag is welk stuk je als eerste aanpakt, en waaraan je merkt of het de moeite waard was. Daar gaat dit stuk over.
